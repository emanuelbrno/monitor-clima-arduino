<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="background:#e8edeb" viewBox="0 0 840 370" role="img" aria-label="Esquema elétrico do monitor de clima com LED e buzzer">
        <defs>
          <g id="gnd" stroke="#14201c" stroke-width="2"><line x1="-12" y1="0" x2="12" y2="0"/><line x1="-8" y1="5" x2="8" y2="5"/><line x1="-4" y1="10" x2="4" y2="10"/></g>
        </defs>
        <g font-family="IBM Plex Mono,monospace" font-size="11" fill="#14201c">
          <rect x="300" y="70" width="160" height="240" rx="6" fill="#ffffff" stroke="#14201c" stroke-width="2"/>
          <text x="380" y="195" text-anchor="middle" font-family="Archivo,sans-serif" font-size="16" font-weight="800">Arduino UNO</text>
          <text x="308" y="174">D2</text>
          <text x="452" y="114" text-anchor="end">D8</text>
          <text x="452" y="234" text-anchor="end">D7</text>
          <text x="380" y="88" text-anchor="middle">5V</text>
          <text x="380" y="302" text-anchor="middle">GND</text>
          <rect x="70" y="130" width="100" height="110" rx="6" fill="#e3f2fd" stroke="#14201c" stroke-width="2"/>
          <text x="120" y="122" text-anchor="middle" font-family="Archivo,sans-serif" font-size="14" font-weight="800">Módulo DHT11</text>
          <text x="162" y="149" text-anchor="end">+</text>
          <text x="162" y="174" text-anchor="end">OUT</text>
          <text x="162" y="229" text-anchor="end">−</text>
          <text x="120" y="205" text-anchor="middle" font-size="9" fill="#56665f">pull-up</text>
          <text x="120" y="216" text-anchor="middle" font-size="9" fill="#56665f">na placa</text>
          <text x="696" y="230" fill="#56665f">220 Ω</text>
          <text x="696" y="152" fill="#56665f">LED</text>
          <text x="590" y="262" fill="#56665f">Buzzer</text>
        </g>
        <g fill="none" stroke="#14201c" stroke-width="2" stroke-linejoin="round">
          <line x1="380" y1="70" x2="380" y2="40"/>
          <line x1="380" y1="310" x2="380" y2="335"/>
          <polyline points="170,145 200,145 200,60"/>
          <line x1="170" y1="170" x2="300" y2="170"/>
          <polyline points="170,225 200,225 200,300"/>
          <!-- D8 → LED → 220 → GND -->
          <polyline points="460,110 680,110 680,135"/>
          <line x1="680" y1="160" x2="680" y2="195"/>
          <polyline points="680,195 680,200 673,205 687,213 673,221 687,229 673,237 687,245 680,250 680,300"/>
          <!-- D7 → buzzer → GND -->
          <polyline points="460,230 560,230 560,240"/>
          <line x1="560" y1="284" x2="560" y2="300"/>
        </g>
        <polygon points="668,135 692,135 680,158" fill="#e53935" stroke="#14201c" stroke-width="2"/>
        <line x1="667" y1="160" x2="693" y2="160" stroke="#14201c" stroke-width="2.5"/>
        <g stroke="#e53935" stroke-width="1.6" fill="none"><path d="M696 138 l10 -8 m-5 0 h5 v5"/><path d="M698 148 l10 -8 m-5 0 h5 v5"/></g>
        <!-- símbolo do buzzer -->
        <rect x="546" y="240" width="28" height="44" rx="3" fill="#ffffff" stroke="#14201c" stroke-width="2"/>
        <path d="M578 252 q8 10 0 20 M584 246 q14 16 0 32" fill="none" stroke="#8e24aa" stroke-width="1.8"/>
        <text x="551" y="254" font-family="IBM Plex Mono,monospace" font-size="11" fill="#14201c">+</text>
        <g stroke="#c62828" stroke-width="2.5">
          <line x1="368" y1="40" x2="392" y2="40"/><line x1="188" y1="60" x2="212" y2="60"/>
        </g>
        <g font-family="IBM Plex Mono,monospace" font-size="11" fill="#c62828" text-anchor="middle" font-weight="600">
          <text x="380" y="32">5V</text><text x="200" y="52">5V</text>
        </g>
        <use xlink:href="#gnd" x="380" y="335"/><use xlink:href="#gnd" x="200" y="300"/><use xlink:href="#gnd" x="680" y="300"/><use xlink:href="#gnd" x="560" y="300"/>
      </svg>